<!doctype html><html lang=ja><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><meta name=robots content='noindex,nofollow'><link rel=icon type='image/svg+xml' href='/kishinamien/favicon.svg'><title>ページが見つかりません｜株式会社岸浪園</title><style>
:root{--crimson:#7C0B16;--crimson2:#9E1020;--gold:#B8912F;--ink:#241d1a;--sub:#5c534c;
      --line:#e3d6cc;--bg:#fbf8f5;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif;color:var(--ink);
     background:var(--bg);line-height:1.9;font-size:16px;-webkit-text-size-adjust:100%}
a{color:var(--crimson2);text-underline-offset:3px}
a:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.serif{font-family:'Yu Mincho','Hiragino Mincho ProN','MS PMincho',serif}
.skip{position:absolute;left:-9999px}
.skip:focus{position:static;display:block;background:#fff;color:var(--crimson);padding:8px}
.previewbar{background:#fff3f3;border-bottom:2px solid #d99;color:#7C0B16;padding:9px 16px;
            font-size:14px;text-align:center;font-weight:700}
header.site{background:linear-gradient(100deg,var(--crimson),#9c1420);color:#fff;
            box-shadow:0 2px 10px rgba(0,0,0,.18)}
header.site .bar{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:14px 18px}
header.site .co{font-size:22px;font-weight:700;letter-spacing:2px}
header.site .co small{display:block;font-size:11px;letter-spacing:3px;opacity:.85;font-weight:400}
nav.site{background:rgba(0,0,0,.16)}
nav.site .in{max-width:1000px;margin:0 auto;display:flex;gap:2px;flex-wrap:wrap;padding:0 10px}
nav.site a{color:#fff;text-decoration:none;font-weight:600;font-size:15px;padding:12px 15px;display:block}
nav.site a:hover,nav.site a[aria-current]{box-shadow:inset 0 -4px 0 var(--gold);background:rgba(255,255,255,.08)}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#7C0B16 0%,#a3121f 60%,#7C0B16 100%);
      color:#fff;text-align:center;padding:60px 20px 66px}
.hero .bloom{position:absolute;opacity:.10}
.hero .bloom.a{top:-30px;right:-20px}.hero .bloom.b{bottom:-40px;left:-30px}
.hero h1{font-size:clamp(26px,6vw,44px);margin:0 0 10px;font-weight:700;letter-spacing:4px;border:0;color:#fff}
.hero p{font-size:clamp(15px,3.4vw,18px);margin:0 auto;max-width:640px}
.hero .tag{display:inline-block;border:1px solid rgba(255,255,255,.65);border-radius:30px;padding:5px 16px;
           font-size:13px;letter-spacing:2px;margin-bottom:18px}
main{max-width:1000px;margin:0 auto;padding:10px 18px 70px}
h1{color:var(--crimson);font-size:27px;letter-spacing:1px;margin:28px 0 6px}
.sec{border-bottom:3px solid var(--gold);display:inline-block;padding-bottom:6px}
h2.sec{font-size:24px;margin:34px 0 6px}
h2{color:var(--crimson);font-size:21px;margin:32px 0 8px}
h3{color:var(--ink);font-size:17px;margin:20px 0 6px}
.lead{color:var(--sub);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:16px 0}
.feature{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.feature .ic{width:52px;height:52px;border-radius:12px;background:#fbeef0;display:flex;align-items:center;
             justify-content:center;margin-bottom:10px}
.feature h3{margin:0 0 6px;color:var(--crimson);font-size:18px}
.feature p{margin:0;color:var(--sub);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
.draft{display:inline-block;background:#fff0f0;border:1px solid #d99;color:#7C0B16;border-radius:6px;
       padding:2px 9px;font-size:13px;font-weight:700}
table{border-collapse:collapse;width:100%}
caption{text-align:left;font-weight:700;color:var(--crimson);padding:6px 0}
th,td{border:1px solid var(--line);padding:11px 10px;text-align:left;font-size:15px;vertical-align:top}
thead th{background:#fbf1f2;color:var(--crimson)}
table.kv th{background:#fbf1f2;color:var(--crimson);width:32%}
.rule{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:15px}
.rule b{color:var(--gold);font-family:serif;min-width:1.4em}
.btn{display:inline-block;background:var(--crimson);color:#fff;text-decoration:none;padding:12px 24px;
     border-radius:6px;font-weight:700;font-size:15px}
.btn:hover{background:#5f0810}
.bidcard{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);
         border-left:6px solid var(--crimson);border-radius:10px;padding:16px 18px;margin:12px 0}
.bidcard:hover{background:#fffdfd;border-color:var(--crimson2)}
.bidcard .t{font-weight:700;font-size:18px;color:var(--crimson);margin-bottom:6px}
.bidcard .more{color:var(--crimson2);font-weight:700;font-size:14px;margin-top:8px}
.badge{display:inline-block;border-radius:6px;padding:3px 10px;font-size:13px;font-weight:700;
       background:#7C0B16;color:#fff;margin-right:8px}
.badge.q{background:#8a6a15}.badge.end{background:#5c534c}.badge.cancel{background:#333}
.badge.draft{background:#fff0f0;color:#7C0B16;border:1px solid #d99}
.muted{color:var(--sub);font-size:14px}
.photo{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.photo img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;background:#f1e9e4}
.photo figcaption{padding:9px 12px;font-size:14px;color:var(--sub)}
.steps{counter-reset:st;list-style:none;padding:0;margin:14px 0}
.steps li{position:relative;padding:12px 0 12px 46px;border-bottom:1px dashed var(--line)}
.steps li:before{counter-increment:st;content:counter(st);position:absolute;left:0;top:12px;
  width:30px;height:30px;border-radius:50%;background:#fbeef0;color:var(--crimson);
  font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px}
.steps li b{display:block;color:var(--crimson)}
footer.site{background:var(--crimson);color:#fff;margin-top:30px}
footer.site .in{max-width:1000px;margin:0 auto;padding:26px 18px;display:flex;gap:14px;align-items:center;
                flex-wrap:wrap}
footer.site a{color:#fff}
footer.site .cp{font-size:13px;margin-left:auto}
@media(max-width:560px){header.site .co{font-size:18px}main{padding:6px 13px 54px}
  .hero{padding:44px 16px 50px}table.kv th{width:38%}th,td{padding:9px 7px;font-size:14.5px}
  nav.site a{font-size:14px;padding:11px 12px}}
